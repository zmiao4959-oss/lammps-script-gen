ir_version: 0.1.0
source_intent_id: ''
task_type: equilibration_npt
system:
  material_name: copper
  material_class: metal
  structure:
    source: generated
    generator:
      lattice_type: fcc
      lattice_constant:
        value: 3.615
        unit: Å
        dimension: length
        source: default
        confidence: high
      replication: !!python/tuple
      - 10
      - 10
      - 10
    file_path: null
    file_checksum: null
  species:
  - element: Cu
    role: bulk_atom
    mass:
      value: 63.546
      unit: g/mol
      dimension: mass
      source: default
      confidence: high
  total_atoms: 4000
force_field:
  family: eam
  atom_style: atomic
  pair_style: eam
  pair_style_args: []
  potential_files:
  - name: Cu_u3.eam
    source: builtin
    checksum: null
  elements_covered:
  - Cu
  verification_status: verified
  provenance: default_potential_for_copper
  notes:
  - Default eam potential for copper
cell:
  boundary:
    x: periodic
    y: periodic
    z: periodic
  pressure_control_allowed:
    x: true
    y: true
    z: true
  deformation_allowed:
    x: true
    y: true
    z: true
groups:
- id: all
  selector_type: all
  region: null
  atom_types: null
  subtract_groups: []
  description: All atoms
stages:
- id: min
  type: energy_minimization
  ensemble: null
  minimization:
    energy_tolerance:
      value: 1.0e-06
      unit: dimensionless
      dimension: dimensionless
      source: default
      confidence: medium
    force_tolerance:
      value: 1.0e-08
      unit: eV/Å
      dimension: force
      source: default
      confidence: medium
    max_iterations: 10000
    max_evaluations: 100000
  deformation: null
  duration: null
  nsteps: null
- id: equil
  type: equilibration
  ensemble:
    type: npt
    group: all
    temperature:
      value: 300.0
      unit: K
      dimension: temperature
      source: user
      confidence: high
    temperature_range: null
    pressure_control:
      x:
        value: 0.0
        unit: bar
        dimension: pressure
        source: default
        confidence: medium
      y:
        value: 0.0
        unit: bar
        dimension: pressure
        source: default
        confidence: medium
      z:
        value: 0.0
        unit: bar
        dimension: pressure
        source: default
        confidence: medium
    tdamp:
      value: 0.1
      unit: ps
      dimension: time
      source: default
      confidence: medium
    pdamp:
      value: 1.0
      unit: ps
      dimension: time
      source: default
      confidence: medium
  minimization: null
  deformation: null
  duration:
    value: 200
    unit: ps
    dimension: time
    source: default
    confidence: medium
  nsteps: 200000
timestep:
  value: 0.001
  unit: ps
  dimension: time
  source: default
  confidence: medium
units: metal
observables:
- id: temperature
  type: thermodynamic_scalar
  scope: global
  group: null
  components: []
- id: potential_energy
  type: thermodynamic_scalar
  scope: global
  group: null
  components: []
- id: pressure
  type: thermodynamic_scalar
  scope: global
  group: null
  components: []
- id: volume
  type: thermodynamic_scalar
  scope: global
  group: null
  components: []
- id: density
  type: thermodynamic_scalar
  scope: global
  group: null
  components: []
outputs:
  thermo:
    interval: 100
    fields:
    - step
    - temp
    - pe
    - ke
    - etotal
    - press
    - vol
    - lx
    - ly
    - lz
    - density
  dump:
    enabled: true
    interval: 1000
    fields:
    - id
    - type
    - x
    - y
    - z
    format: custom
  restart: true
  restart_interval: null
analysis:
- id: temperature_stability
  type: temperature_stability
  inputs:
    obs_0: temperature
  outputs:
  - temperature_stability
  parameters: {}
- id: pressure_stability
  type: pressure_stability
  inputs:
    obs_0: pressure
  outputs:
  - pressure_stability
  parameters: {}
- id: volume_convergence
  type: volume_convergence
  inputs:
    obs_0: volume
  outputs:
  - volume_convergence
  parameters: {}
assumptions:
- 使用 EAM 势函数描述原子间相互作用
- 使用默认晶格常数生成初始结构
- 使用 eam 势函数 (Cu_u3.eam) 描述 copper 原子间相互作用
- 使用 fcc 晶格生成初始结构，晶格常数 3.615 Å
provenance:
  intent_task_type: equilibration_npt
